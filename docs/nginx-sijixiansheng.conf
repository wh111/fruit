# 四季果先 · Nginx（阿里云 ECS 39.96.71.39）
# 主域名：sijixiansheng.xin（无 www）
# 用法：放到 /etc/nginx/sites-available/ 后软链启用，证书路径按实际修改

server {
    listen 80;
    server_name sijixiansheng.xin www.sijixiansheng.xin;
    return 301 https://sijixiansheng.xin$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.sijixiansheng.xin;
    ssl_certificate     /etc/nginx/ssl/sijixiansheng.xin.pem;
    ssl_certificate_key /etc/nginx/ssl/sijixiansheng.xin.key;
    return 301 https://sijixiansheng.xin$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sijixiansheng.xin;

    ssl_certificate     /etc/nginx/ssl/sijixiansheng.xin.pem;
    ssl_certificate_key /etc/nginx/ssl/sijixiansheng.xin.key;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
