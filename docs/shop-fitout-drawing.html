<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <title>四季果先 · 装修设计对接</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; margin: 24px; background: #f0f0f0; color: #222; max-width: 1100px; }
    h1 { font-size: 22px; }
    .note { background: #fff3e0; border-left: 4px solid #f5a623; padding: 12px 16px; margin: 16px 0; line-height: 1.7; }
    img { width: 100%; border-radius: 6px; box-shadow: 0 2px 12px rgba(0,0,0,.08); margin: 8px 0 20px; }
    h2 { font-size: 17px; color: #2E7D32; margin-top: 28px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid figcaption { font-size: 13px; color: #555; margin-top: 6px; line-height: 1.5; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>四季果先 · 装修方案示意</h1>
  <div class="note">
    当前阶段<strong>不做毫米级精确</strong>，只定方向：左前有柱、门洞偏窄、上方风管、单门小冷柜、顶部门头斜装菜单、水平台面。
    图上的「约 × m」是口述尺寸的大致参考，<strong>施工图要等设计师现场复尺</strong>后再定。
  </div>

  <h2>① 现场照片</h2>
  <img src="shop-fitout-site-survey.png" alt="现场四图汇总"/>

  <h2>② 四角度</h2>
  <div class="grid">
    <figure>
      <img src="site-photos/01-facade-front.png" alt="正立面"/>
      <figcaption>正立面：柱在左，门洞偏右</figcaption>
    </figure>
    <figure>
      <img src="site-photos/02-entrance-duct.png" alt="门洞风管"/>
      <figcaption>门洞仰视：风管 + 金属网</figcaption>
    </figure>
    <figure>
      <img src="site-photos/03-interior-floor.png" alt="铺内"/>
      <figcaption>铺内：绿磨石，后墙制作间</figcaption>
    </figure>
    <figure>
      <img src="site-photos/04-corridor-pillar.png" alt="走廊柱面"/>
      <figcaption>走廊侧：柱面 + 开关</figcaption>
    </figure>
  </div>

  <h2>③ 方案示意（立面 + 平面）</h2>
  <img src="shop-fitout-pro-board.png" alt="对接图"/>

  <h2>④ 透视参考（效果向，非施工图）</h2>
  <img src="shop-fitout-perspective-mockup.png" alt="透视"/>
</body>
</html>
