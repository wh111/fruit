  <text x="120.00" y="110.00" font-size="15" fill="#666666" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-weight="normal">说明：左侧结构柱 1280×700 占用了门面左侧，故入口视觉开间约 2.65m；</text>
  <text x="120.00" y="138.00" font-size="15" fill="#666666" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-weight="normal">前场按效果图落地：菜单柱面 + 收银台 + 玻璃鲜切间 + 取货口 + 双门展示冷柜。</text>
  <text x="120.00" y="166.00" font-size="15" fill="#666666" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-weight="normal">制作间到顶玻璃封闭，洗切装均在内部完成，经传递窗交付。</text>
  <text x="120.00" y="210.00" font-size="14" fill="#222222" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-weight="bold">铺位净尺寸：</text>
